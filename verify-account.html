<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Потвърждение на имейл | PDG Systems</title><style>body{margin:0;background:#071722;color:#eef8f7;font:15px/1.5 system-ui;display:grid;place-items:center;min-height:100dvh}.card{max-width:460px;width:calc(100% - 60px);padding:28px;background:#102a39;border:1px solid #31505b;border-radius:16px}p{color:#bed4d6}button{font:inherit;padding:11px 18px;border:0;border-radius:8px;background:#4ee1bd;color:#082b28;cursor:pointer;font-weight:bold}a{color:#80e9cc}</style></head><body><main class="card"><h1>Потвърди имейла си</h1><p>Натиснете бутона, ако сте заявили регистрация в PDG Systems.</p><button id="confirm" type="button">Потвърди регистрацията</button><p id="status" role="status" aria-live="polite"></p><a href="account-draft.html">Към входа</a></main><script>
(()=>{const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||'';history.replaceState(null,'',location.pathname);const button=document.getElementById('confirm'),status=document.getElementById('status');if(!/^[a-f0-9]{64}$/.test(token)){button.disabled=true;status.textContent='Линкът е невалиден или липсва.';return}button.onclick=async()=>{button.disabled=true;status.textContent='Проверка…';try{let r=await fetch('./api/account-draft.php?action=session',{credentials:'same-origin',cache:'no-store'}),s=await r.json();if(!r.ok)throw Error();r=await fetch('./api/registration-draft.php?action=verify',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify({token})});if(!r.ok)throw Error();status.textContent='Имейлът е потвърден. Вече можете да влезете в профила си.'}catch(e){status.textContent='Линкът е невалиден, изтекъл или услугата не е активна.'}}})();
</script></body></html>
