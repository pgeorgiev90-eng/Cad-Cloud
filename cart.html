<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Количка | PDG Systems</title><style>
*{box-sizing:border-box}body{margin:0;background:#081723;color:#ecf8f7;font:16px/1.5 system-ui}main{max-width:960px;margin:auto;padding:30px 18px}a{color:#70e4cb}.item,.summary{background:#102a39;border:1px solid #31505b;border-radius:12px;padding:18px;margin:12px 0}.item{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.info{flex:1;min-width:190px}.item h2{font-size:17px;margin:0}input,button{font:inherit;border-radius:8px;padding:8px}input{width:75px;background:#0b202d;border:1px solid #496d76;color:white}button{cursor:pointer;border:1px solid #496d76;background:#4ee1bd;color:#082b28}.muted{color:#aac4ca}
</style></head><body><main><a href="catalog.html">← Продължи пазаруването</a><h1>Моята количка</h1><p class="muted">Избраните артикули се съхраняват само в този браузър. Цените са в евро без ДДС.</p><p id="message" role="status">Зареждане…</p><div id="items"></div><div class="summary"><strong>Междинна сума без ДДС: <span id="total">—</span></strong><p class="muted">Доставката и крайната цена не са изчислени. Поръчването с наложен платеж все още се подготвя.</p></div></main><script>
(async()=>{const key='pdg_cart_v1',items=document.getElementById('items'),message=document.getElementById('message'),total=document.getElementById('total');let cart={};try{cart=JSON.parse(localStorage.getItem(key)||'{}');if(!cart||typeof cart!=='object'||Array.isArray(cart))cart={}}catch(e){cart={}}
let products;try{let r=await fetch('api/products.php',{cache:'no-store'});if(!r.ok)throw Error();let data=await r.json();if(!Array.isArray(data.products))throw Error();products=data.products}catch(e){message.textContent='Каталогът временно не е достъпен. Съдържанието на количката е запазено.';return}
const save=()=>localStorage.setItem(key,JSON.stringify(cart));function render(){items.replaceChildren();let sum=0,unavailable=0;for(const [id,value] of Object.entries(cart)){let qty=Number(value),p=products.find(x=>String(x.id)===id);if(!Number.isInteger(qty)||qty<1||qty>999||!p||p.price===null||p.price===''||!Number.isFinite(Number(p.price))){unavailable++;continue}let cents=Math.round(Number(p.price)*100);sum+=cents*qty;let row=document.createElement('div');row.className='item';let info=document.createElement('div');info.className='info';let h=document.createElement('h2');h.textContent=p.name;let code=document.createElement('div');code.textContent='Код: '+p.code+' · '+(cents/100).toFixed(2)+' € без ДДС';info.append(h,code);let label=document.createElement('label');label.textContent='Количество ';let input=document.createElement('input');input.type='number';input.min='1';input.max='999';input.value=qty;input.setAttribute('aria-label','Количество за '+p.name);input.onchange=()=>{let n=Number(input.value);if(Number.isInteger(n)&&n>=1&&n<=999){cart[id]=n;save();render()}else input.value=qty};label.append(input);let remove=document.createElement('button');remove.type='button';remove.textContent='Премахни';remove.onclick=()=>{delete cart[id];save();render()};row.append(info,label,remove);items.append(row)}total.textContent=(sum/100).toFixed(2)+' €';message.textContent=unavailable?'Някои избрани артикули вече не са достъпни или нямат цена.':items.children.length?'':'Количката е празна.'}render()})();
</script></body></html>
