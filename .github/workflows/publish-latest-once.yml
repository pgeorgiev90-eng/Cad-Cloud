name: Publish latest website once
on:
  push:
    paths:
      - '.github/workflows/publish-latest-once.yml'
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    needs: [account-tests, shop-tests]
    runs-on: ubuntu-latest
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pdg_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Verify solar quote calculations and PHP syntax
        run: |
          node --check electrical-busbar-core.js
          node --check electrical-busbar.js
          node tests/electrical_busbar_test.js
          node --check electrical-quote.js
          node --check electrical-quote-core.js
          node --check electrical-cad-design.js
          node tests/electrical_quote_test.js
          node --check solar-offer.js
          node tests/solar_offer_test.js
          node tests/solar_string_test.js
          php -l api/product-phase-bootstrap.php
          php -l api/products.php
          php -r 'for($i=0;$i<30;$i++){try{$db=new PDO("mysql:host=127.0.0.1;dbname=pdg_migration_test","root","ci-only-password");$db->query("SELECT 1");exit(0);}catch(Throwable $e){usleep(1000000);}}exit(1);'
          php tests/phase_migration.php
          php -l api/product-spec-bootstrap.php
          php -l api/product-details.php
          php tests/spec_migration.php
          node tests/catalog_specifications_test.js
          php -l api/product-category-bootstrap.php
          php tests/category_migration.php
          node tests/catalog_categories_test.js
          php -l api/solar-yield.php
          php -l api/product-content-bootstrap.php
          php tests/content_migration.php
          node --check product.js
          node --check solar-mobile.js
          node tests/solar_mobile_test.js
          node tests/solar_location_test.js
          python - <<'PYJS'
          from pathlib import Path
          import re, subprocess
          for index, code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', (Path('roof-cad.html').read_text()+Path('electrical-cad.html').read_text()), re.S)):
              if code.strip():
                  script=Path('/tmp/pdg-editor-'+str(index)+'.js'); script.write_text(code)
                  subprocess.run(['node','--check',str(script)],check=True)
          PYJS
      - name: Verify public specification API
        run: |
          php tests/configure_spec_ci.php
          php -S 127.0.0.1:8094 -t . > /tmp/spec-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python - <<'PYTEST'
          import json, urllib.request, time
          for attempt in range(20):
              try:
                  data=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/products.php',timeout=10))
                  break
              except Exception:
                  if attempt==19: raise
                  time.sleep(.5)
          assert len(data['products'])==204
          assert all(p.get('description') for p in data['products'])
          assert sum(bool(p.get('imageUrl')) for p in data['products']) >= 45
          product=next(p for p in data['products'] if p['name']=='X1-BOOST-5K-G4')
          details=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/product-details.php?id='+str(product['id']),timeout=10))
          assert len(details['fields'])>=8
          assert not any(f['label']=='Източник за фазност' for f in details['fields'])
          assert any(f['label']=='Номинална AC мощност (kW)' and f['value']=='5.1' for f in details['fields'])
          print('PASS: public API serves editable specifications and hides phase-source rows')
          PYTEST
      - name: Validate credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish website
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          put electrical-busbar-core.js -o /electrical-busbar-core.js.pdg-upload
          put electrical-busbar.js -o /electrical-busbar.js.pdg-upload
          put electrical-cad-design.css -o /electrical-cad-design.css.pdg-upload
          put electrical-cad-design.js -o /electrical-cad-design.js.pdg-upload
          put electrical-quote-core.js -o /electrical-quote-core.js.pdg-upload
          put electrical-quote.js -o /electrical-quote.js.pdg-upload
          put electrical-cad.html -o /electrical-cad.html.pdg-upload
          mv -f /electrical-busbar-core.js.pdg-upload /electrical-busbar-core.js
          mv -f /electrical-busbar.js.pdg-upload /electrical-busbar.js
          mv -f /electrical-cad-design.css.pdg-upload /electrical-cad-design.css
          mv -f /electrical-cad-design.js.pdg-upload /electrical-cad-design.js
          mv -f /electrical-quote-core.js.pdg-upload /electrical-quote-core.js
          mv -f /electrical-quote.js.pdg-upload /electrical-quote.js
          mv -f /electrical-cad.html.pdg-upload /electrical-cad.html
          bye
          LFTP

