name: Publish latest website once
on:
  push:
    paths:
      - '.github/workflows/publish-latest-once.yml'
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pdg_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Verify solar quote calculations and PHP syntax
        run: |
          node --check solar-offer.js
          node tests/solar_offer_test.js
          node tests/solar_string_test.js
          php -l api/product-phase-bootstrap.php
          php -l api/products.php
          php tests/phase_migration.php
          php -l api/solar-yield.php
      - name: Validate credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish website
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          mirror --reverse --verbose --only-newer --no-perms --exclude-glob .git/ --exclude-glob .github/ --exclude-glob tests/ --exclude-glob README.md --exclude-glob BUSINESS-ARCHITECTURE.md --exclude-glob .gitignore ./ /
          bye
          LFTP

