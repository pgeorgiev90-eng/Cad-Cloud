name: Verify account release safely
on:
  push:
    paths:
      - .github/workflows/verify-account-release.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live public routes without credentials
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          root='https://pdgsystems.bg/'
          def request(path, method='GET'):
              req=urllib.request.Request(root+path,method=method,headers={'User-Agent':'PDG-deployment-check'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return response.status,response.read()
              except urllib.error.HTTPError as err: return err.code,err.read()
          code,raw=request('api/account-draft.php?action=session')
          body=json.loads(raw)
          assert code==200 and body.get('user') is None and len(body.get('csrf',''))==64, 'anonymous account session failed'
          print('Account session:',code,'anonymous; registration enabled:',body.get('registration_available'))
          code,raw=request('api/admin-products-draft.php')
          assert code==401, 'anonymous admin access not blocked'
          print('Anonymous admin API:',code,'blocked')
          code,raw=request('api/setup-admin-draft.php','POST')
          assert code==403, 'setup accepted without session and CSRF'
          print('Unauthenticated setup:',code,'blocked')
          code,raw=request('api/products.php')
          body=json.loads(raw)
          assert code==200 and isinstance(body.get('products'),list), 'catalog unavailable'
          print('Catalog API:',code,'products:',len(body['products']))
          for page in ('auth.html','setup-admin-draft.html','admin-products-draft.html'):
              code,raw=request(page)
              assert code==200 and b'<!doctype html>' in raw.lower(), 'missing page: '+page
              print('Page',page,':',code)
          PY
