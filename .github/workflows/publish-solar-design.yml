name: Publish Solar CAD design
on:
  push:
    paths:
      - '.github/workflows/publish-solar-design.yml'
      - 'roof-cad.html'
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check preserved Solar CAD behavior
        run: |
          node tests/solar_mobile_test.js
          node tests/solar_offer_test.js
          node tests/solar_string_test.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for i, code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', Path('roof-cad.html').read_text(), re.S)):
              if code.strip():
                  p=Path('/tmp/solar-'+str(i)+'.js')
                  p.write_text(code)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Install encrypted FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish Solar CAD page
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          put roof-cad.html -o /roof-cad.html
          bye
          LFTP
