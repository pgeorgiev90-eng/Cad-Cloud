name: Publish Electric and Solar CAD update
on:
  push:
    branches: [deploy/electric-cad-catalog-20261106]
    paths: ['.github/workflows/deploy-cad-brand-price-20261106.yml']
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eef23bbf6a0db5860d2e6966b0dbc84538fb4b3e
          path: previous
      - uses: actions/checkout@v4
        with:
          ref: a4b11185bf469a86e7aa6b37f47932f7745afb32
          path: reviewed
      - name: Verify the reviewed changes
        working-directory: reviewed
        run: |
          set -e
          php -l electrical-cad.php
          php -l roof-cad.php
          for file in electrical-busbar.js electrical-schematic-symbols.js electrical-cad-design.js solar-offer.js; do node --check "$file"; done
          for file in tests/*.js tests/*.cjs; do node "$file"; done
      - name: Publish and verify CAD files over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib, io, os, ssl, subprocess, tempfile
          from pathlib import Path
          paths = ['electrical-schematic-symbols.js', 'electrical-busbar.js', 'electrical-cad-design.js',
                   'electrical-cad-design.css', 'solar-offer.js', 'electrical-cad.php', 'roof-cad.php']
          payload = {p: (Path('reviewed') / p).read_bytes() for p in paths}
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          ftp.connect(os.environ['FTP_HOST'], 21)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/')
          def read(path):
              buffer = io.BytesIO()
              ftp.retrbinary('RETR ' + path, buffer.write)
              return buffer.getvalue()
          stage = {p: '.deploy-' + os.environ['GITHUB_RUN_ID'] + '-' + p for p in paths}
          originals = {}
          for p in paths:
              old_file = Path('previous') / p
              expected = old_file.read_bytes() if old_file.exists() else None
              try:
                  old = read(p)
              except ftplib.error_perm as error:
                  if expected is not None or not str(error).startswith('550'):
                      raise
                  old = None
              if p.endswith('.php') and old != payload[p]:
                  updates = {
                      'electrical-cad.php': [
                          (b'electrical-cad-design.css?v=phase2', b'electrical-cad-design.css?v=brand1'),
                          (b'electrical-cad-design.js?v=20261105b', b'electrical-cad-design.js?v=brand1'),
                          (b'<script src="electrical-busbar.js?v=barflow1">',
                           b'<script src="electrical-schematic-symbols.js?v=1"></script><script src="electrical-busbar.js?v=schematic1">'),
                      ],
                      'roof-cad.php': [(b'solar-offer.js?v=4', b'solar-offer.js?v=5')],
                  }
                  candidate = old
                  for before, after in updates[p]:
                      if candidate.count(after) == 1 and candidate.count(before) == 0:
                          continue
                      if candidate.count(before) != 1 or after in candidate:
                          raise RuntimeError(f'Unexpected deployed reference in {p}: {before!r}')
                      candidate = candidate.replace(before, after)
                  with tempfile.NamedTemporaryFile(suffix='.php') as temp:
                      temp.write(candidate)
                      temp.flush()
                      subprocess.run(['php', '-l', temp.name], check=True)
                  payload[p] = candidate
              elif old not in (expected, payload[p]):
                  raise RuntimeError('Unexpected hosting version: ' + p)
              originals[p] = old
          changed = []
          try:
              for p in paths:
                  ftp.storbinary('STOR ' + stage[p], io.BytesIO(payload[p]))
                  assert read(stage[p]) == payload[p], p
              for p in paths:
                  ftp.rename(stage[p], p)
                  changed.append(p)
              for p in paths:
                  assert read(p) == payload[p], p
                  print('Verified', p)
          except Exception:
              for p in reversed(changed):
                  if originals[p] is None:
                      ftp.delete(p)
                      continue
                  ftp.storbinary('STOR ' + stage[p], io.BytesIO(originals[p]))
                  ftp.rename(stage[p], p)
                  assert read(p) == originals[p], p
              raise
          finally:
              for p in paths:
                  try:
                      ftp.delete(stage[p])
                  except ftplib.error_perm:
                      pass
              ftp.quit()
      - name: Check published assets, editor access and store pricing
        shell: python
        run: |
          import json, time, urllib.request
          from decimal import Decimal
          from pathlib import Path
          root = 'https://pdgsystems.bg/'
          def get(path):
              sep = '&' if '?' in path else '?'
              with urllib.request.urlopen(root + path + sep + 'release=' + str(time.time_ns()), timeout=30) as r:
                  return r.read()
          for name, version in [('electrical-busbar.js','schematic1'), ('electrical-schematic-symbols.js','1'),
                                ('electrical-cad-design.js','brand1'), ('electrical-cad-design.css','brand1'),
                                ('solar-offer.js','5')]:
              assert get(name + '?v=' + version) == (Path('reviewed') / name).read_bytes(), name
          assert b'<svg' in get('assets/pdg-systems-logo.svg?v=roof-plug-ltd')
          for page in ('electrical-cad.php', 'roof-cad.php'):
              response = get(page).decode('utf-8')
              assert 'Вход | PDG Systems' in response, page
          cad = json.loads(get('api/electric-catalog.php'))['products']
          assert any(p['sku'] == 'MC216233S-' and p['depthMm'] == 190.5 for p in cad)
          products = json.loads(get('api/products.php'))['products']
          inverter = next(p for p in products if p['name'] == 'X1-BOOST-5K-G4')
          detail = json.loads(get('api/product-details.php?id=' + str(inverter['id'])))['product']
          assert Decimal(str(detail['price'])) == Decimal(str(inverter['price'])) > 0
          print('Verified live CAD assets, guest access, Schrack dimensions and shop inverter price:', detail['price'])
