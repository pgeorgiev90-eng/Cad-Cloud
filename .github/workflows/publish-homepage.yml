name: Publish PDG homepage

on:
  push:
    branches: [main]
    paths:
      - index.html
      - api/contact-enquiries.php
      - contact-enquiries.js
      - admin-electric.js
      - admin-electric.html
      - roof-cad.html
      - electrical-cad.html
      - pdg-helper.js
      - assets/solar-cad-homepage.webp
      - assets/electric-cad-homepage.webp

permissions:
  contents: read

concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check enquiry form
        run: |
          php -l api/contact-enquiries.php
          node --check contact-enquiries.js
          node --check admin-electric.js
      - name: Publish updated website files over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib
          import os
          import ssl

          paths = ('assets/solar-cad-homepage.webp', 'assets/electric-cad-homepage.webp', 'pdg-helper.js', 'roof-cad.html', 'electrical-cad.html', 'api/contact-enquiries.php', 'contact-enquiries.js', 'admin-electric.js', 'admin-electric.html', 'index.html')
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=35) as ftp:
              ftp.connect(os.environ['FTP_HOST'], 21)
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              for path in paths:
                  temporary = f'/{path}.upload'
                  with open(path, 'rb') as source:
                      ftp.storbinary(f'STOR {temporary}', source)
                  ftp.rename(temporary, f'/{path}')
