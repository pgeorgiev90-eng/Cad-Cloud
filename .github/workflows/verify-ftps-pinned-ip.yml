name: Verify FTPS with pinned hosting IP

on:
  push:
    paths:
      - .github/workflows/verify-ftps-pinned-ip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check TLS identity and read-only FTP listing using pinned IP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          curl --fail --show-error --silent --verbose --max-time 35 \
            --ssl-reqd --ftp-ssl-control \
            --resolve host-185-80-2-82.superhosting.bg:21:185.80.2.82 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            "ftp://host-185-80-2-82.superhosting.bg:21/" \
            -o /tmp/ftp-root-listing.txt 2>/tmp/ftps-diagnostic.txt || {
              sed -E 's/(Authorization: ).*/\1[redacted]/I; s/(USER |PASS ).*/\1[redacted]/I' /tmp/ftps-diagnostic.txt | tail -35
              exit 1
            }
          echo "FTPS TLS and authentication succeeded."
          echo "Remote root entries:"
          head -50 /tmp/ftp-root-listing.txt
