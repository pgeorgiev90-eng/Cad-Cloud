name: CAD core regression tests
on:
  pull_request:
    paths:
      - 'electrical-*.js'
      - 'roof-cad.php'
      - 'tests/**'
      - '.github/workflows/cad-core-tests.yml'
  workflow_dispatch:
jobs:
  cad-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/electric-cad-core.test.cjs
