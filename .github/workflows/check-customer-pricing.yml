name: Check customer pricing
on:
  push:
    branches:
      - fix/cad-layout-validation-20261106
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and JavaScript syntax
        run: |
          for file in api/{customer-pricing,admin-users,products,product-details,shop-common,cart,checkout,electric-catalog,electric-enquiries,electric-common}.php; do php -l "$file" || exit; done
          for file in {store,product,electrical-catalog,solar-offer}.js; do node --check "$file" || exit; done
      - name: Test isolated login and authorization
        run: |
          php tests/bootstrap-account-ci.php
          php -r '$s=require dirname(getcwd())."/pdg-shop-db.php";$d=new PDO("mysql:host=".$s["host"].";dbname=".$s["database"],$s["username"],$s["password"]);$d->exec("CREATE TABLE pdg_email_tokens (user_id BIGINT UNSIGNED NOT NULL)");$q=$d->prepare("INSERT INTO products(brand,category,code,name,price) VALUES(?,?,?,?,?)");$q->execute(["Enerack","Test","PRICING-CI","Test price",100]);'
          php -d auto_prepend_file=/tmp/pdg-test-https.php -d "sendmail_path=/bin/sh $GITHUB_WORKSPACE/tests/capture-mail-ci.sh" -S 127.0.0.1:8199 -t . > /tmp/pdg-php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8199/api/account-draft.php?action=session; then break; fi
            sleep 1
          done
          python3 tests/customer_pricing.py
