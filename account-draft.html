<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход | PDG Systems</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 15%,#164b59,#071522 58%);font:15px system-ui;color:#eef8ff}header{padding:22px 5%;display:flex;justify-content:space-between}a{color:#79e4cc}main{display:grid;place-items:center;padding:25px}.card{width:min(100%,440px);padding:32px;background:#10283b;border:1px solid #3b6472;border-radius:20px}h1{font-size:29px;margin:0 0 8px}p{color:#b6cad6;line-height:1.6}label{display:block;margin:14px 0 6px}input,button{font:inherit;border-radius:9px;border:1px solid #4c7281;padding:12px;color:white;background:#091d2c;width:100%}button{cursor:pointer;font-weight:bold;background:#4cddba;color:#062c2a;margin-top:18px}#status{min-height:30px;color:#ffb3a8}#links a{display:block;margin-top:15px}</style></head><body><header><strong>PDG Systems · CAD Cloud</strong><a href="index.html">Начало</a></header><main><section class="card"><div id="login"><h1>Добре дошли</h1><p>Влезте в своя профил.</p><form id="form"><label for="email">Имейл адрес</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Парола</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="submit">Вход</button></form><button id="register-open" type="button" hidden>Създай профил</button><p id="registration-note" hidden>Клиентската регистрация ще бъде активирана след настройка на имейла.</p></div><div id="register" hidden><h1>Регистрация</h1><p>Ще изпратим линк за потвърждение на имейла ви.</p><form id="register-form"><label for="register-email">Имейл адрес</label><input id="register-email" type="email" autocomplete="email" required maxlength="254"><label for="register-password">Парола — минимум 12 символа</label><input id="register-password" type="password" autocomplete="new-password" required minlength="12" maxlength="72"><button type="submit">Регистрирай се</button></form><button id="login-open" type="button">Обратно към вход</button></div><div id="account" hidden><h1>Моят профил</h1><p id="email-view"></p><div id="links"><a href="roof-cad.html">Solar CAD</a><a href="electrical-cad.html">Електро CAD</a><a id="admin" href="admin-products-draft.html" hidden>Управление на продукти</a></div><button id="logout" type="button">Изход</button></div><p id="status" role="status" aria-live="polite"></p></section></main><script>
(async()=>{const $=id=>document.getElementById(id);let csrf='';async function req(action,options={}){let r=await fetch('./api/account-draft.php?action='+action,{credentials:'same-origin',cache:'no-store',...options});let j=await r.json();if(!r.ok)throw new Error(j.error||'unavailable');return j}function show(user){$('register').hidden=true;$('login').hidden=!!user;$('account').hidden=!user;if(user){$('email-view').textContent=user.email;$('admin').hidden=user.role!=='admin'}}async function session(){let j=await req('session');csrf=j.csrf;$('register-open').hidden=!j.registration_available;$('registration-note').hidden=!!j.registration_available||!!j.user;show(j.user)}try{await session()}catch(e){$('status').textContent='Входът все още не е активиран.';return}$('register-open').onclick=()=>{$('login').hidden=true;$('register').hidden=false;$('status').textContent=''};$('login-open').onclick=()=>{$('register').hidden=true;$('login').hidden=false;$('status').textContent=''};$('register-form').onsubmit=async e=>{e.preventDefault();let b=$('register-form').querySelector('button');b.disabled=true;$('status').textContent='Моля, изчакайте…';try{let r=await fetch('./api/registration-draft.php?action=register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({email:$('register-email').value.trim(),password:$('register-password').value})});if(!r.ok)throw Error();$('register-password').value='';$('status').textContent='Ако регистрацията е възможна, ще получите имейл за потвърждение.'}catch(err){$('status').textContent='Регистрацията не е налична. Опитайте по-късно.'}finally{b.disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Проверка…';try{await req('login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});$('password').value='';await session();$('status').textContent=''}catch(err){$('status').textContent=err.message==='try_later'?'Твърде много опити. Опитайте по-късно.':err.message==='service_unavailable'?'Входът все още не е настроен.':'Неуспешен вход. Проверете данните си.'}};$('logout').onclick=async()=>{try{await req('logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});await session();$('status').textContent='Излязохте от профила.'}catch(e){$('status').textContent='Изходът не бе потвърден.'}}})();
</script></body></html>
